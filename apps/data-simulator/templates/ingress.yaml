{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: axion-data-simulator

spec:
  ingressClassName: nginx

  rules:
    - host: {{ .Values.ingress.host | quote }}

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: axion-data-simulator
                port:
                  number: {{ .Values.service.port }}
{{- end }}