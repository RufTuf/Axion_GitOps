apiVersion: apps/v1
kind: Deployment

metadata:
  name: axion-ui

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: axion-ui

  template:
    metadata:
      labels:
        app: axion-ui

    spec:
      containers:
        - name: axion-container

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.service.targetPort }}