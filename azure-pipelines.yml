
name: axion-ui-deployment

trigger: none

pool:
  name: Default

stages:

# ==================================================
# Stage 1: Update GitOps Helm Values
# ==================================================

- stage: UpdateGitOps
  displayName: Update GitOps Repository

  jobs:
  - job: UpdateHelmValues
    displayName: Update Helm Image Tag

    steps:
    - checkout: none

    - bash: |
        set -e

        echo "CI Image Tag: $(CI_IMAGE_TAG)"

        echo "Cloning GitOps repository"

        git clone https://$(GITHUB_USERNAME):$(GITHUB_PAT)@github.com/RufTuf/Axion_GitOps.git

        cd Axion_GitOps

        echo "Updating Helm image tag"

        sed -i 's/tag: .*/tag: "$(CI_IMAGE_TAG)"/' helm/axion-ui/values.yaml

        git config user.email "azure-pipeline@axion.com"
        git config user.name "Azure DevOps"

        git add helm/axion-ui/values.yaml

        if git diff --cached --quiet; then
          echo "No changes detected"
          exit 0
        fi

        git commit -m "Update Axion UI image to $(CI_IMAGE_TAG)"

        git push origin HEAD:main

        echo "GitOps repository updated successfully"

      displayName: Update GitOps Helm Values

      env:
        GITHUB_USERNAME: $(RufTuf)
        GITHUB_PAT: $(https://github.com/RufTuf/Axion_GitOps)
        CI_IMAGE_TAG: $(axionacr1.azurecr.io/axionui:526)
