
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: axion-data-simulator-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/RufTuf/Axion_GitOps.git
    targetRevision: main
    path: apps/data-simulator

    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
